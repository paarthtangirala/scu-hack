version: '3.8'
services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    ports: ["5050:5050"]
    env_file: ../.env
    environment:
      - PORT=5050
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    ports: ["3000:80"]
    depends_on: [backend]
    restart: unless-stopped
