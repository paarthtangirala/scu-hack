version: '3.8'
services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    ports: ["5000:5000"]
    env_file: ../.env
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    ports: ["3000:80"]
    depends_on: [backend]
    restart: unless-stopped
